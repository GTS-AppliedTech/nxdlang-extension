[package]
name = "nxdlang-extension"
version = "0.1.0"
edition = "2024"
authors = ["Gabriel Ty Spencer"]
license = "MIT"
description = "VS Code extension and language tooling integration for the NXD programming language"
repository = "https://github.com/GTS-AppliedTech/nxdlang-extension"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

nxd_language = { path = "../nxd_language" }

[[bin]]
name = "lsp_parser"
path = "NXD/lsp_parser.rs"

[[bin]]
name = "lsp_validate"
path = "NXD/lsp_validate.rs"